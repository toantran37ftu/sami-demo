<title>Kế toán</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap">
<style>
/* Layout: sidebar trong suốt trên nền có ánh màu · khung nội dung bo tròn nổi nhẹ · dải lọc nền nhạt · ngăn chi tiết trượt phải */
:root{
  --bg:#f3f5fa;--glow:rgba(2,132,199,.10);--glow2:rgba(124,58,237,.07);
  --card:#ffffff;--panel:#f6f8fc;--th:#f8fafd;--col:#f1f4f9;
  --ink:#1f2a3d;--mute:#6b7487;--line:#e6e9f0;--line2:#eef1f6;
  --brand:#0284c7;--brand2:#6366f1;--brand-soft:#e6f3fb;--brand-ink:#075985;
  --nav-on-ink:#ffffff;
  --ok:#16a34a;--ok-soft:#e3f6ea;--warn:#b45309;--warn-soft:#fdf1dc;--err:#dc2626;--err-soft:#fde8e8;
  --pur:#7c3aed;--pur-soft:#f1eafe;--gray-soft:#eef1f6;--sel:#eef7fd;
  --shadow-sm:0 1px 2px rgba(16,24,40,.05),0 1px 3px rgba(16,24,40,.04);
  --shadow:0 10px 30px -12px rgba(16,24,40,.18),0 2px 6px rgba(16,24,40,.05);
  --shadow-lg:0 30px 60px -20px rgba(16,24,40,.30);
  --font:"Inter","Segoe UI",system-ui,sans-serif;--display:"Plus Jakarta Sans","Inter","Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0c0f16;--glow:rgba(56,189,248,.10);--glow2:rgba(129,140,248,.08);
  --card:#141924;--panel:#101520;--th:#121722;--col:#0f141e;
  --ink:#e6e9f0;--mute:#97a0b3;--line:#232a38;--line2:#1c2230;
  --brand:#38bdf8;--brand2:#818cf8;--brand-soft:#0d2a3d;--brand-ink:#bae6fd;--nav-on-ink:#06121c;
  --ok:#4ade80;--ok-soft:#10301f;--warn:#fbbf24;--warn-soft:#33260b;--err:#f87171;--err-soft:#3a1616;
  --pur:#c4b5fd;--pur-soft:#261d42;--gray-soft:#1c2230;--sel:#0f2333;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 10px 30px -12px rgba(0,0,0,.6);--shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0c0f16;--glow:rgba(56,189,248,.10);--glow2:rgba(129,140,248,.08);
  --card:#141924;--panel:#101520;--th:#121722;--col:#0f141e;
  --ink:#e6e9f0;--mute:#97a0b3;--line:#232a38;--line2:#1c2230;
  --brand:#38bdf8;--brand2:#818cf8;--brand-soft:#0d2a3d;--brand-ink:#bae6fd;--nav-on-ink:#06121c;
  --ok:#4ade80;--ok-soft:#10301f;--warn:#fbbf24;--warn-soft:#33260b;--err:#f87171;--err-soft:#3a1616;
  --pur:#c4b5fd;--pur-soft:#261d42;--gray-soft:#1c2230;--sel:#0f2333;
  --shadow-sm:0 1px 2px rgba(0,0,0,.4);--shadow:0 10px 30px -12px rgba(0,0,0,.6);--shadow-lg:0 30px 60px -20px rgba(0,0,0,.7);color-scheme:dark}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;color:var(--ink);font:14px/1.5 var(--font);background:radial-gradient(900px 520px at 105% -10%,var(--glow),transparent 70%),radial-gradient(700px 500px at -10% 110%,var(--glow2),transparent 70%),var(--bg);background-attachment:fixed}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--brand);outline-offset:2px}
a{color:var(--brand)}

/* ---- khung ---- */
.app{display:flex;min-height:100%;padding:14px max(14px,env(safe-area-inset-right,0px)) 14px 0}
.side{width:244px;flex-shrink:0;padding:10px 12px 12px max(14px,env(safe-area-inset-left,0px));display:flex;flex-direction:column;position:sticky;top:14px;height:calc(100vh - 28px)}
.logo{display:flex;gap:11px;align-items:center;padding:6px 8px 18px}
.logo b{width:38px;height:38px;border-radius:11px;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font:700 13px var(--display);box-shadow:0 8px 18px -6px var(--brand)}
.logo .t{font:700 15px var(--display);letter-spacing:-.01em}.logo .s{font-size:12px;color:var(--mute)}
.grp{font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--mute);padding:16px 12px 6px;font-weight:600}
.nav{flex:1;min-height:0;overflow-y:auto;margin:0 -4px;padding:0 4px}
.nav a{display:flex;align-items:center;gap:11px;padding:9px 12px;border-radius:10px;color:inherit;text-decoration:none;font-weight:500;margin-bottom:2px;transition:background .15s,color .15s}
.nav a:hover{background:var(--card);box-shadow:var(--shadow-sm)}
.nav a.on{background:linear-gradient(135deg,var(--brand),var(--brand2));color:var(--nav-on-ink);box-shadow:0 10px 20px -10px var(--brand)}
.nav svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:1.8;flex-shrink:0}
.badge{margin-left:auto;background:var(--brand);color:#fff;border-radius:999px;font-size:11px;padding:1px 8px;font-weight:600}
.nav a.on .badge{background:rgba(255,255,255,.25)}
.user{margin-top:auto;display:flex;gap:10px;align-items:center;padding:12px;border-radius:12px;background:var(--card);box-shadow:var(--shadow-sm);font-size:13px;font-weight:500}
.av{width:30px;height:30px;border-radius:50%;background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff;display:grid;place-items:center;font-weight:700;font-size:11px;flex-shrink:0}
.main{flex:1;min-width:0;background:var(--card);border:1px solid var(--line);border-radius:20px;padding:30px 34px 44px;box-shadow:var(--shadow)}

/* ---- tiêu đề, nút, ô nhập ---- */
.top{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:20px}
.top>div:first-child{flex:1;min-width:240px}
h1{font:700 27px/1.2 var(--display);margin:0;letter-spacing:-.02em;text-wrap:balance}
.sub{color:var(--mute);margin-top:6px}
h3{font:700 15px var(--display);margin:0;letter-spacing:-.01em}
.btn{display:inline-flex;align-items:center;gap:7px;border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 14px;font-weight:600;white-space:nowrap;box-shadow:var(--shadow-sm);transition:transform .12s,box-shadow .12s,border-color .12s}
.btn:hover{border-color:var(--brand);transform:translateY(-1px)}
.btn.p{background:linear-gradient(135deg,var(--brand),var(--brand2));border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px var(--brand)}
.btn.g{background:linear-gradient(135deg,#16a34a,#0d9488);border-color:transparent;color:#fff;box-shadow:0 10px 20px -10px #16a34a}
.btn.s{padding:4px 10px;font-size:12.5px;border-radius:8px}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.btn svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:16px}
.main>.bar{background:var(--panel);border:1px solid var(--line2);border-radius:14px;padding:10px 12px}
.sp{flex:1}
.inp,select.inp{border:1px solid var(--line);background:var(--card);border-radius:10px;padding:8px 12px;min-width:0;transition:border-color .15s,box-shadow .15s}
.inp:focus{border-color:var(--brand);box-shadow:0 0 0 3px var(--brand-soft);outline:none}
.seg{display:inline-flex;background:var(--gray-soft);border-radius:10px;padding:3px;gap:2px;flex-wrap:wrap}
.seg button{border:0;background:transparent;padding:6px 13px;border-radius:8px;color:var(--mute);font-weight:600;font-size:13px}
.seg button:hover{color:var(--ink)}
.seg button.on{background:var(--card);color:var(--brand);box-shadow:var(--shadow-sm)}

/* ---- thẻ, chỉ số ---- */
.card{background:var(--card);border:1px solid var(--line);border-radius:var(--r);min-width:0;box-shadow:var(--shadow-sm)}
.card>h3,.card>.hd{padding:15px 18px;border-bottom:1px solid var(--line2);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin-bottom:18px}
.kpi{padding:16px 18px;position:relative;overflow:hidden}
.kpi::after{content:"";position:absolute;right:-30px;top:-30px;width:110px;height:110px;border-radius:50%;background:radial-gradient(circle,var(--brand-soft),transparent 70%);pointer-events:none}
.kpi .k{color:var(--mute);font-size:12.5px;font-weight:500;display:flex;align-items:center;gap:8px}
.kpi .v{font:700 24px var(--display);margin-top:10px;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.kpi .d{font-size:12px;color:var(--mute);margin-top:4px}
.ki{width:28px;height:28px;border-radius:8px;display:grid;place-items:center;background:var(--brand-soft);color:var(--brand);flex-shrink:0}
.ki svg{width:15px;height:15px;stroke:currentColor;fill:none;stroke-width:2}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(340px,1fr));gap:16px;margin-bottom:16px}
.scroll{overflow-x:auto}

/* ---- bảng ---- */
table{width:100%;border-collapse:collapse}
th{text-align:left;font-weight:600;padding:11px 14px;border-bottom:1px solid var(--line);font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);white-space:nowrap;background:var(--th)}
td{padding:12px 14px;border-bottom:1px solid var(--line2);vertical-align:middle}
tr:last-child td{border-bottom:0}
.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tr.click{cursor:pointer}tr.click td{transition:background .12s}tr.click:hover td{background:var(--sel)}
tr.sel td{background:var(--sel)}tr.bad td{background:var(--err-soft)}tr.wrn td{background:var(--warn-soft)}
tr.sub>td{background:var(--panel);padding:10px 14px 14px 48px}
tr.sub table{background:var(--card);border:1px solid var(--line);border-radius:10px;overflow:hidden}
tr.sub th{background:var(--card)}

/* ---- nhãn ---- */
.chip{display:inline-flex;align-items:center;gap:6px;border-radius:999px;padding:3px 10px;font-size:12px;font-weight:600;white-space:nowrap}
.chip::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor;opacity:.9}
.ok{background:var(--ok-soft);color:var(--ok)}.warn{background:var(--warn-soft);color:var(--warn)}.err{background:var(--err-soft);color:var(--err)}
.info{background:var(--brand-soft);color:var(--brand)}.gray{background:var(--gray-soft);color:var(--mute)}.pur{background:var(--pur-soft);color:var(--pur)}
.km{display:inline-flex;gap:6px;align-items:center;border:1px solid var(--line);border-radius:8px;padding:3px 9px;background:var(--panel);font-weight:600;font-size:12.5px;white-space:nowrap}
.km i{font-style:normal;color:var(--mute);font-weight:500}
button.km:hover{border-color:var(--brand);background:var(--brand-soft)}
.tag{font-size:12px;color:var(--mute)}
.lnk{border:0;background:transparent;color:var(--brand);padding:0;font-weight:600;text-align:left;cursor:pointer}
.lnk:hover{text-decoration:underline}
.who{display:flex;gap:10px;align-items:center;min-width:180px}
.lg{width:34px;height:34px;border-radius:10px;background:linear-gradient(135deg,var(--brand-soft),var(--pur-soft));display:grid;place-items:center;font-size:11.5px;font-weight:700;color:var(--brand-ink);flex-shrink:0}
.ai{display:inline-flex;gap:4px;align-items:center;border-radius:999px;padding:3px 9px;font-size:11.5px;font-weight:700;background:linear-gradient(135deg,var(--brand-soft),var(--pur-soft));color:var(--brand)}
.note{border-radius:12px;padding:12px 14px;background:var(--brand-soft);color:var(--ink);font-size:13px;border:1px solid transparent}
.note.y{background:var(--warn-soft)}
.cb{width:16px;height:16px;accent-color:var(--brand)}
.dot{width:8px;height:8px;border-radius:50%;display:inline-block}

/* ---- kanban ---- */
.kb{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:16px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--col);border:1px solid var(--line2);border-radius:16px;padding:12px;min-height:340px;transition:outline-color .15s}
.col.over{outline:2px dashed var(--brand);outline-offset:2px}
.colh{display:flex;gap:9px;align-items:center;font:700 14px var(--display);padding:4px 6px 12px}
.colh .c{margin-left:auto;background:var(--card);border-radius:999px;padding:1px 10px;font:600 12px var(--font);color:var(--mute);box-shadow:var(--shadow-sm)}
.kc{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin-bottom:10px;cursor:grab;box-shadow:var(--shadow-sm);transition:transform .15s,box-shadow .15s,border-color .15s}
.kc:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand-soft)}
.kc .m{display:flex;justify-content:space-between;align-items:center;margin-top:10px;gap:6px;flex-wrap:wrap}
.kc .m b{font:700 15px var(--display);font-variant-numeric:tabular-nums}
.kc .chip{white-space:normal}
.mini{height:5px;border-radius:9px;background:var(--line2);overflow:hidden;margin-top:10px}.mini div{height:100%;border-radius:9px}

/* ---- ngăn chi tiết, modal, hộp chọn ---- */
.veil{position:fixed;inset:0;background:rgba(10,15,30,.35);backdrop-filter:blur(2px);z-index:19}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(1040px,92vw);background:var(--card);border-left:1px solid var(--line);box-shadow:var(--shadow-lg);z-index:20;overflow-y:auto;padding-bottom:max(28px,env(safe-area-inset-bottom,0px));padding-top:env(safe-area-inset-top,0px);border-radius:20px 0 0 20px}
.dh{padding:22px 24px 16px;border-bottom:1px solid var(--line2);background:linear-gradient(180deg,var(--brand-soft),transparent)}
.dh .lg{width:42px;height:42px;font-size:13px}
.sec{padding:22px 24px 12px;margin-top:18px;border-top:1px solid var(--line);font:700 17px var(--display);letter-spacing:-.01em;display:flex;gap:10px;align-items:center}
.sec::before,.h2::before{content:"";width:4px;height:20px;border-radius:4px;background:linear-gradient(var(--brand),var(--brand2));flex-shrink:0}
.h2{font:700 17px var(--display);letter-spacing:-.01em;display:inline-flex;gap:10px;align-items:center}
.kpi.go{cursor:pointer;transition:transform .15s,box-shadow .15s,border-color .15s}.kpi.go:hover{transform:translateY(-2px);box-shadow:var(--shadow);border-color:var(--brand-soft)}
.kpi.go .d::after{content:" →";color:var(--brand)}
.dpad{padding:0 24px}
.drawer.full{left:0;width:auto;border-radius:0;border-left:0;background:var(--bg);padding-top:0}
.fh{position:sticky;top:0;z-index:3;background:color-mix(in srgb,var(--card) 92%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);padding:14px max(32px,env(safe-area-inset-right,0px)) 14px max(32px,env(safe-area-inset-left,0px));display:flex;gap:14px;align-items:center;flex-wrap:wrap}
.fh .back{border:0;background:var(--gray-soft);border-radius:10px;padding:8px 12px;font-weight:600;color:var(--mute)}
.fh .back:hover{color:var(--ink)}
.dgrid{display:grid;grid-template-columns:minmax(0,1fr) 420px;gap:24px;padding:24px 32px 48px;max-width:1560px;margin:0 auto;align-items:start}
.dmain{display:flex;flex-direction:column;gap:20px;min-width:0}
.dside{display:flex;flex-direction:column;gap:16px;position:sticky;top:86px}
.pane{background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow-sm);min-width:0}
.pane>.ph{display:flex;gap:10px;align-items:center;padding:18px 22px 14px;flex-wrap:wrap}
.pane>.pb{padding:0 22px 20px}
.dside .ck{grid-template-columns:1fr}
.jr .r{display:grid;grid-template-columns:30px 56px minmax(0,1fr) auto;gap:10px;align-items:baseline;padding:11px 22px;border-top:1px solid var(--line2)}
.jr .r .dcl{color:var(--mute)}.jr .r.cr{padding-left:44px}
.jr .acc{font-weight:700;font-variant-numeric:tabular-nums}.jr .an{color:var(--mute);min-width:0}
.jr .amt{font-variant-numeric:tabular-nums;white-space:nowrap;text-align:right}.jr .r.dr .amt{font-weight:700}
.jr .tot{display:flex;gap:10px;align-items:center;padding:13px 22px;border-top:1px solid var(--line);color:var(--ok);font-weight:600}
.jr .tot b{margin-left:auto;color:var(--ink);font:700 16px var(--display)}
.inwords{font-style:italic;color:var(--mute)}
@media (max-width:1100px){.dgrid{grid-template-columns:1fr;padding:16px}.dside{position:static}}

.ck{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:8px 16px;margin-top:12px}
.ck div{display:flex;gap:9px;align-items:flex-start;font-size:13px;font-weight:500}
.ck i{font-style:normal;width:20px;height:20px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:800;flex-shrink:0;margin-top:1px}
.ck .ck-ok i{background:var(--ok);color:#fff}.ck .ck-miss i{background:var(--err);color:#fff}.ck .ck-wait i{border:2px solid var(--line);background:transparent}.ck .ck-na i{background:var(--gray-soft);color:var(--mute)}
.ck .ck-na{color:var(--mute)}.ck small{display:block;color:var(--mute);font-size:11.5px;font-weight:400}
.modal{position:fixed;inset:0;z-index:30;display:grid;place-items:center;padding:16px;background:rgba(10,15,30,.4);backdrop-filter:blur(3px)}
.modal>.box{background:var(--card);border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-lg);width:min(660px,100%);max-height:calc(100vh - 32px);overflow:auto}
.modal>.box.wide{width:min(1140px,100%)}
.mh{display:flex;align-items:flex-start;gap:10px;padding:20px 24px;border-bottom:1px solid var(--line2)}
.mb{padding:18px 24px}
.mf{display:flex;gap:10px;justify-content:flex-end;padding:14px 24px;border-top:1px solid var(--line2);flex-wrap:wrap}
.x{border:0;background:var(--gray-soft);font-size:18px;color:var(--mute);line-height:1;width:32px;height:32px;border-radius:50%;display:grid;place-items:center}
.x:hover{color:var(--ink)}
.pop{position:absolute;z-index:25;background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow-lg);width:310px;overflow:hidden}
.pop input{width:100%;border:0;border-bottom:1px solid var(--line2);padding:12px 14px;background:transparent}
.pop .h{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute);padding:10px 14px 4px;font-weight:600}
.pop button.o{display:flex;width:100%;justify-content:space-between;gap:8px;border:0;background:transparent;padding:8px 14px;text-align:left}
.pop button.o:hover{background:var(--brand-soft)}
.pop label{display:flex;gap:6px;align-items:flex-start;padding:10px 14px;border-top:1px solid var(--line2);font-size:12.5px;color:var(--mute)}

/* ---- tiến độ, bước ---- */
.step{display:flex;gap:10px;align-items:center;padding:7px 0}
.step .n{width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-size:11px;font-weight:700;background:var(--gray-soft);color:var(--mute)}
.step.done .n{background:var(--ok);color:#fff}.step.cur .n{background:var(--brand);color:#fff;box-shadow:0 0 0 4px var(--brand-soft)}
.prog{height:8px;border-radius:9px;background:var(--line2);overflow:hidden}.prog div{height:100%;border-radius:9px;background:linear-gradient(90deg,var(--brand),var(--brand2));transition:width .3s}
.drop{border:1.5px dashed var(--brand);background:linear-gradient(135deg,var(--brand-soft),var(--pur-soft));border-radius:16px;padding:22px;text-align:center}
.steps{display:flex;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.st{flex:1;min-width:160px;display:flex;gap:11px;align-items:center;border:1px solid var(--line);border-radius:14px;padding:12px 14px;background:var(--card);box-shadow:var(--shadow-sm)}
.st .n{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;font-weight:700;font-size:12px;background:var(--gray-soft);color:var(--mute)}
.st.done .n{background:var(--ok);color:#fff}.st.cur{border-color:var(--brand);box-shadow:0 0 0 4px var(--brand-soft)}.st.cur .n{background:linear-gradient(135deg,var(--brand),var(--brand2));color:#fff}
.st small{display:block;color:var(--mute);font-size:11.5px}
.paper{background:#fff;color:#222;border:1px solid #e3e3e3;border-radius:8px;padding:22px 24px;font-family:"Times New Roman",serif;font-size:12px;box-shadow:0 12px 30px -16px rgba(0,0,0,.35)}
.paper table td,.paper table th{padding:3px 4px;border-bottom:1px solid #eee;color:#222;background:#fff;text-transform:none;letter-spacing:0;font-size:12px}
.hl{outline:2px solid #0284c7;border-radius:2px}.hl.w{outline-color:#d97706;background:rgba(217,119,6,.12)}
.rv{font-size:14.5px;display:grid;gap:26px;padding:22px 28px}

/* ================== 1.2 Hóa đơn, chứng từ ================== */
const repName = (k) => (k === "1331" ? "Thuế GTGT được khấu trừ" : k === "33311" ? "Thuế GTGT đầu ra" : kmOf(k).name);

  const inRep = (i) => S.kmf === "all" || (["1331", "33311"].includes(S.kmf) ? i.tax && taxKey(i) === S.kmf : i.lines.some((l) => l.km === S.kmf));
  return S.invoices.filter((i) => inPer(i.date, S.per) && inRep(i) && (S.dir === "all" || i.dir === S.dir) && (!q || `${i.partner} ${i.no} ${i.mst}`.toLowerCase().includes(q)));
}

  const head = `<div class="top"><div><h1>Hóa đơn, chứng từ</h1><div class="sub">${perLabel(S.per)} · ${list.filter((i) => i.dir !== "Chứng từ").length} hóa đơn · ${list.filter((i) => i.dir === "Chứng từ").length} chứng từ khác</div></div>
    <span class="chip ok" style="padding:6px 10px">Đã đồng bộ với cổng thuế · lần cuối ${S.lastSync}</span>
    <button class="btn" data-act="sync" id="syncbtn">${ic("sync")}Đồng bộ chứng từ</button><button class="btn" data-act="newupload">${ic("up")}Tải hóa đơn lên</button><button class="btn p" data-act="newdoc">${ic("doc")}Lập chứng từ</button></div>
  <div class="bar"><div class="seg"><button class="${S.invView === "list" ? "on" : ""}" data-act="invview" data-v="list">Danh sách</button><button class="${S.invView === "kb" ? "on" : ""}" data-act="invview" data-v="kb">Kanban</button></div>
    ${perSel("per")}<select class="inp" id="f-kmf" aria-label="Báo cáo / khoản mục"><option value="all">Mọi báo cáo / khoản mục</option>${KM.map((k) => `<option value="${k.code}" ${S.kmf === k.code ? "selected" : ""}>Báo cáo: ${esc(k.name)} (${k.acc})</option>`).join("")}<option value="1331" ${S.kmf === "1331" ? "selected" : ""}>Báo cáo: Thuế GTGT được khấu trừ (1331)</option><option value="33311" ${S.kmf === "33311" ? "selected" : ""}>Báo cáo: Thuế GTGT đầu ra (33311)</option></select><select class="inp" id="f-dir" aria-label="Chiều"><option value="all">Mua vào + Bán ra + Chứng từ</option>${["Mua vào", "Bán ra", "Chứng từ"].map((d) => `<option ${S.dir === d ? "selected" : ""}>${d}</option>`).join("")}</select>
    <input class="inp" id="f-q" placeholder="Tìm MST, số hóa đơn, đối tác" value="${esc(S.q)}" style="flex:1;min-width:180px"></div>
  ${S.kmf !== "all" ? `<div class="note" style="margin-bottom:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap">Đang xem hóa đơn thuộc báo cáo <b>${esc(repName(S.kmf))}</b> · ${perLabel(S.per)}<span class="sp"></span><button class="btn s" data-act="gorep" data-k="${S.kmf}">Mở báo cáo này</button><button class="btn s" data-act="kmfclear">Bỏ lọc</button></div>` : ""}`;
  if (S.invView === "kb") {

    return head + `<div class="tag" style="margin-bottom:8px">Kéo thẻ từ “Chờ duyệt” sang “Đã duyệt” để duyệt; kéo về “Cần xử lý” để để xử lý sau.</div><div class="kb">${cols.map((k) => {
      const items = list.filter((i) => i.step === k);
      return `<div class="col" data-drop="${k}"><div class="colh"><span class="dot" style="background:var(--${STEPS[k][1] === "info" ? "brand" : STEPS[k][1] === "gray" ? "mute" : STEPS[k][1]})"></span>${STEPS[k][0]}<span class="c">${items.length}</span></div>
      ${items.map((i) => `<div class="kc" draggable="${k !== "daxuat"}" data-drag="${i.id}" data-act="openinv" data-id="${i.id}" tabindex="0">${who(i.partner)}<div class="tag" style="margin-top:6px">${esc(i.no)} · ${i.date}</div><div style="margin-top:6px;display:flex;gap:4px;flex-wrap:wrap">${[...new Set(i.lines.map((l) => l.km))].map(kmChip).join("")}</div>

  <div class="card scroll"><table><tr><th></th><th>Đối tác</th><th>Ký hiệu – Số</th><th>Ngày</th><th class="n">Tổng tiền</th><th>Cổng thuế</th><th>Khoản mục</th><th>Nguồn</th><th>Bước</th></tr>
  ${rows.map((i) => `<tr class="click ${S.sel.has(i.id) ? "sel" : ""}" data-act="openinv" data-id="${i.id}"><td>${canBulk(i) ? `<input type="checkbox" class="cb" data-act="pick" data-id="${i.id}" ${S.sel.has(i.id) ? "checked" : ""} aria-label="Chọn">` : ""}</td>
  <td>${who(i.partner, i.dir)}</td><td>${esc(i.no)}</td><td>${i.date}</td><td class="n" style="font-weight:600">${vnd(total(i))}</td><td>${chip(...PORTAL[i.portal])}</td>
  <td>${[...new Set(i.lines.map((l) => l.km))].map(kmChip).join(" ")}</td><td class="tag">${i.source.startsWith("AI") ? `<span class="ai">${esc(i.source)}</span>` : esc(i.source)}</td><td>${chip(STEPS[i.step][1], STEPS[i.step][0])}</td></tr>`).join("") || `<tr><td colspan="9" class="tag" style="padding:20px">Không có hóa đơn nào ở bước này.</td></tr>`}
  </table></div>`;
}

      filePreview(`Bảng kê hóa đơn ${d.toLowerCase()} · tháng 11/2026`, ["Số HĐ", "Ngày", "Đối tác", "MST", "Tiền hàng", "Thuế", "Cổng thuế", "Duyệt"], list.map((i) => [i.no, i.date, i.partner, i.mst, sub(i), i.tax, PORTAL[i.portal][1], STEPS[i.step][0]])); },
    copycsv: () => { const csv = $("#layer").dataset.csv; navigator.clipboard?.writeText(csv).then(() => toast("Đã sao chép"), () => toast("Trình duyệt không cho sao chép")); },
    openbatch: () => { S.cur = t.dataset.id; nav("file-chi"); },
    newbatch: () => { const id = "b" + (S.batches.length + 1);
      S.batches.unshift({ id, name: "Thăm hỏi đợt 7 tháng 06/2026", date: "28/06", method: "Chuyển khoản", status: "nhap", col: "31", stmt: null,
        rows: [{ card: "004xxx", name: "Lê Thị Ngọc H", dept: "Chuyền 14", amt: 300000, reason: "Ốm bản thân", acct: "225704070016076" }, { card: "000xxx", name: "Nguyễn Thị B", dept: "Nhà ăn", amt: 400000, reason: "Mẹ mất", acct: "225704070015517" },
          { card: "000xxx", name: "Lê Hữu C", dept: "KH-KD-CBSX", amt: 200000, reason: "Mẹ ốm", acct: "225704070015559" }, { card: "000xxx", name: "Nguyễn Thị Minh T", dept: "Kế toán", amt: 400000, reason: "Cha mất", acct: "225704070015613" },
          { card: "004xxx", name: "Lê Ngọc T", dept: "Chuyền 14", amt: 200000, reason: "Con ốm", acct: "" }, { card: "001xxx", name: "Bùi Thị Thanh T", dept: "XK X2", amt: 400000, reason: "Cha mất", acct: "225704070016418" }] });
      S.tcPer = { m: "month", v: 6 }; S.cur = id; render(); toast("Đã đọc File nhập.xlsx · 6 dòng"); },
    setacct: () => { const b = S.batches.find((x) => x.id === S.cur); const v = $(`#acct-${t.dataset.n}`).value.replace(/\D/g, ""); if (v.length < 8) return toast("Số tài khoản chưa đúng"); b.rows[+t.dataset.n].acct = v; render(); },
    confirm: () => { const b = S.batches.find((x) => x.id === S.cur); const v = $(`#cf-${t.dataset.n}`).value.trim(); if (!v) return toast("Ghi lý do xác nhận trước"); b.rows[+t.dataset.n].confirm = v; render(); },
    bankfile: () => { const b = S.batches.find((x) => x.id === S.cur); if (b.status === "nhap") { b.status = "dagui"; render(); }
      filePreview(`File gửi ngân hàng · ${b.name}`, ["STT", "TK chuyển", "Số tiền", "TK hưởng", "Tên người hưởng", "Mã NH", "Nội dung"], b.rows.map((r, n) => [n + 1, "129000072468", r.amt, r.acct, r.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d"), "79321001", `CDCS VV3 chi ${b.name.normalize("NFD").replace(/[̀-ͯ]/g, "").replace(/đ/gi, "d").toLowerCase()}`]), "Mẫu chuyển tiền hàng loạt VietinBank eFAST."); },
    loadstmt: () => { if (S.stmtLoaded) return toast("Đã có sao kê tháng 06"); S.stmtLoaded = true; S.others.push(...[{ date: "30/06", desc: "Trả lãi tài khoản", in: 65934, type: "Thu – lãi tiền gửi" }, { date: "30/06", desc: "Phí duy trì IB, phí BDSD T06", out: 66000, type: "Phí ngân hàng (33)", col: "33" }, { date: "30/06", desc: "Chi đóng CĐP tháng 06/2026", out: 12400000, type: "Nộp cấp trên (39)", col: "39" }]); render(); toast("Đã đọc sao kê mẫu · 635 giao dịch"); },
    stmttab: () => { S.stmtTab = t.dataset.id; render(); },
    note: () => { const b = S.batches.find((x) => x.id === t.dataset.b); const v = $(`#nt-${t.dataset.n}`).value.trim(); if (!v) return toast("Nhập ghi chú trước"); stmtRows(b)[+t.dataset.n].note = v; render(); },
    closebatch: () => { const b = S.batches.find((x) => x.id === t.dataset.id); b.status = "dachot"; render(); toast("Đã chốt đợt chi, đã đưa vào sổ"); },
    minutes: () => { const b = S.batches.find((x) => x.id === t.dataset.id); filePreview(`Biên bản đối chiếu · ${b.name}`, ["Người nhận", "TK nhận", "Theo file chi", "Theo sao kê", "Kết quả", "Ghi chú"], stmtRows(b).map((r) => [r.name, r.acct || "", r.amt ?? "", r.bank ?? "", r.res[1], r.note || ""])); },
    lock: () => { S.periodLocked = true; render(); toast("Đã khóa kỳ 06/2026"); },
    exportbook: () => { const rows = bookRows().filter((x) => inPer(x.date, S.tcPer)); filePreview("Sổ thu, chi tài chính – mẫu S82 · " + perLabel(S.tcPer).toLowerCase(), ["Ngày", "Số CT", "Diễn giải", "Cột", "Số tiền"], rows.map((r) => [r.date, r.no, r.desc, r.col, r.amt])); },
  }[a];
  if (act) { e.preventDefault(); act(); }
});
document.addEventListener("input", (e) => {
  if (e.target.dataset.ln && S.open) {
    const i = curDoc(), l = i.lines.find((x) => x.id === +e.target.dataset.id), k = e.target.dataset.ln, v = e.target.value;
    l[k] = k === "price" ? +v.replace(/\D/g, "") || 0 : k === "qty" ? +v.replace(",", ".") || 0 : v;
    recalc(i); const cell = $("#lna-" + l.id); if (cell) cell.textContent = vnd(l.amt);
    $("#jr-box").innerHTML = journalHTML(i); $("#sum-box").innerHTML = sumHTML(i); return;
  }
  if (e.target.id === "dm-q") { S.dmQ = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#dm-q"); q.focus(); q.setSelectionRange(pos, pos); }
  if (e.target.id === "f-q") { S.q = e.target.value; const pos = e.target.selectionStart; render(); const q = $("#f-q"); q.focus(); q.setSelectionRange(pos, pos); }
});
document.addEventListener("change", (e) => {
  if (e.target.dataset.ln && S.open) { renderDrawer(); return; }
  if (e.target.dataset.invf && S.open) {
    const i = curDoc(), k = e.target.dataset.invf; let v = e.target.value.trim();
    if (k === "op") { const o = opOf(v); Object.assign(i, { op: o[1], dir: o[3], ctr: o[4], portal: o[3] === "Chứng từ" ? "ctkhac" : "cho" }); return renderDrawer(); }
    if (k === "rate") { i.rate = +v; return renderDrawer(); }
    if (k === "tax") v = +v.replace(/\D/g, "") || 0;
    if (k === "date") { const m = v.match(/^(\d{1,2})\/(\d{1,2})/); if (!m) { toast("Ngày dạng dd/mm/yyyy"); return renderDrawer(); } v = m[1].padStart(2, "0") + "/" + m[2].padStart(2, "0"); }
    if (k === "series" || k === "num") { const [se, nu] = i.no.includes("-") ? i.no.split("-") : ["", i.no]; v = k === "series" ? `${v}-${nu}` : se ? `${se}-${v}` : v; e.target.dataset.invf = "no"; }
    const kk = k === "series" || k === "num" ? "no" : k;
    const old = i[kk]; if (String(old) === String(v)) return;
    if (i === S.draftDoc) { i[kk] = v; return renderDrawer(); }
    i[kk] = v; i.history.push([now(), `Kế toán Hạnh sửa ${{ partner: "đối tượng", mst: "mã số thuế", no: "ký hiệu / số hoá đơn", date: "ngày hoá đơn", tax: "thuế GTGT" }[kk]}: ${kk === "tax" ? vnd(old) : old} → ${kk === "tax" ? vnd(v) : v}`]);
    render(); toast("Đã lưu thay đổi");
  }
  if (e.target.id === "f-dir") { S.dir = e.target.value; render(); }
  if (e.target.id === "f-kmf") { S.kmf = e.target.value; if (S.kmf !== "all") S.tab = "all"; render(); }
  if (e.target.id === "f-batch") { S.cur = e.target.value; render(); }
  if (e.target.dataset.per) { S[e.target.dataset.per].v = +e.target.value; S.rsel = null; render(); }
  if (e.target.id === "f-fmt") { S.fmt = e.target.value; }
  if (e.target.id === "dm-type") { S.dmType = e.target.value; render(); }
  if (e.target.id === "dd-type") { $("#dd-accwrap").hidden = e.target.value !== "Expense Item"; }
  if (false && e.target.dataset.kmf) { const k = KM[+e.target.dataset.n]; const v = e.target.value.trim(); if (e.target.dataset.kmf === "acc" && !/^\d{3,6}$/.test(v)) { toast("Số tài khoản 3–6 chữ số"); return render(); } k[e.target.dataset.kmf] = v; toast("Đã lưu khoản mục"); }
  if (e.target.id === "filepick") {
    const f = e.target.files[0]; e.target.value = ""; if (!f) return;
    if (false) {}
    else if (pickMode === "invoice" && S.draftDoc) runRead(f);
    else if (pickMode === "ledger") { S.ledgerTo = "15/11/2026"; render(); toast(`Đã cập nhật sổ cái từ ${f.name}`); }
  }
});
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") { document.querySelector(".pop")?.remove() || closeLayer(); }
  if (e.key === "Enter" && e.target.matches?.(".kpi.go")) e.target.click();
  if (e.key === "Enter" && e.target.matches?.(".kc")) { S.open = +e.target.dataset.id; renderDrawer(); }
});
// Kanban kéo thả
document.addEventListener("dragstart", (e) => { const c = e.target.closest?.("[data-drag]"); if (c) e.dataTransfer.setData("text/plain", c.dataset.drag); });
document.addEventListener("dragover", (e) => { const col = e.target.closest?.("[data-drop]"); if (col) { e.preventDefault(); document.querySelectorAll(".col.over").forEach((x) => x.classList.remove("over")); col.classList.add("over"); } });
document.addEventListener("drop", (e) => {
  const col = e.target.closest?.("[data-drop]"); if (!col) return; e.preventDefault();
  const i = S.invoices.find((x) => x.id === +e.dataTransfer.getData("text/plain")); const to = col.dataset.drop; if (!i || i.step === to) return render();
  if (to === "daduyet") { if (PROBLEM.includes(i.portal)) { render(); return toast(`Chưa duyệt được: ${PORTAL[i.portal][1].toLowerCase()}`); } i.step = "daduyet"; i.flagged = false; i.history.push([now(), "Kế toán Hạnh duyệt (kéo thả)"]); toast("Đã duyệt"); }
  else if (to === "canxuly") { i.flagged = true; if (i.step === "daduyet") i.step = "choduyet"; i.history.push([now(), "Để xử lý sau"]); toast("Đã chuyển sang Cần xử lý"); }
  else if (to === "choduyet") { if (PROBLEM.includes(i.portal)) { render(); return toast("Xử lý trạng thái cổng thuế trước"); } i.flagged = false; if (i.step === "daduyet") i.step = "choduyet"; }
  else { render(); return toast("Dùng tab Xuất file để xuất"); }
  S.exSel = null; render();
});
go();
</script>
